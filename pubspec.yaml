name: cavaina_app
description: Applicazione Flutter inizializzata per il progetto CavainaApp.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/LOGO_Ca_Vaina/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/LOGO_Ca_Vaina/CAVAINA_LOGO_BADGE.png
  remove_alpha_ios: true
